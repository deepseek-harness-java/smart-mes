<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 生产助手台 · Smart MES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f6f8; color:#22272e; }
  header { background:linear-gradient(135deg,#26323e,#46626f); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(38,50,62,.08); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#26323e; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#edf1f4; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#46626f; margin-top:4px; }
  .stat span { font-size:12px; color:#71808f; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .ln { border:1px solid #e3e8ee; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .ln .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .ln b { color:#26323e; font-size:13.5px; }
  .ln .meta { font-size:12.5px; color:#5a6a7a; line-height:1.7; }
  .bar { height:8px; background:#e3e8ee; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:#46626f; }
  .bar i.warn { background:#c07f16; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(38,50,62,.08); }
  .ai-head { background:linear-gradient(135deg,#26323e,#46626f); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#edf1f4; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#22272e; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #eef1f5; }
  .chip { font-size:12px; background:#edf1f4; color:#26323e; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#dfe5ea; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #eef1f5; }
  .ai-input input { flex:1; border:1px solid #d5dce4; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#46626f; }
  .ai-input button { background:#46626f; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#a9b8c6; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏭 AI 生产助手台</h1>
    <div class="sub">产线 · 排产 · 报工 · 设备 · 质量 | 智能制造 MES</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>生产看板</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>产线状态</h2>
      <div id="lines"></div>
    </div>
    <div class="card">
      <h2>在产工单</h2>
      <div id="orders"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>🤖 AI 生产助手</b>
      <div class="sub">mes-copilot · 产线 / 排产 / 报工 / 设备 / 质量</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('现在各产线什么状态？整体进度如何？')">生产看板</button>
      <button class="chip" onclick="ask('E101 贴片机状态怎么样？需要维修吗？')">设备体检</button>
      <button class="chip" onclick="ask('最近质量怎么样？主要缺陷是什么？')">质量分析</button>
      <button class="chip" onclick="ask('在 L03 排一个 6000 件的智能温控器工单，交期 10-08')">快速排产</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：注塑机故障了吗？帮我在 L01 排 2000 件新单" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
const lnTag = s => s==='运行中' ? '<span class="tag g">运行中</span>' : s==='换型中' ? '<span class="tag y">换型中</span>' : s==='保养中' ? '<span class="tag b">保养中</span>' : '<span class="tag r">停机</span>';
const woTag = s => s==='生产中' ? '<span class="tag g">生产中</span>' : s==='待开工' ? '<span class="tag y">待开工</span>' : s==='已暂停' ? '<span class="tag r">已暂停</span>' : s==='已完成' ? '<span class="tag b">已完成</span>' : '<span class="tag y">'+s+'</span>';
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `在产 ${st.openOrders} 单 · 进度 ${st.progress}%`;
    document.getElementById('stats').innerHTML = `
      <div><span>在产工单</span><b>${st.openOrders}</b></div>
      <div><span>整体进度</span><b>${st.progress}%</b></div>
      <div><span>设备预警</span><b style="color:${st.equipAlarm>0?'#c74a44':'#218a58'}">${st.equipAlarm}</b></div>
      <div><span>建议</span><b style="font-size:12px;line-height:1.5;color:#5a6a7a">${st.advice}</b></div>`;
    const ls = await j(fetch('/api/lines'));
    document.getElementById('lines').innerHTML = ls.map(l => `
      <div class="ln">
        <div class="top"><b>${l.id} · ${l.name}</b>${lnTag(l.status)}</div>
        <div class="meta">${l.product} · ${l.shift} · 完成 ${l.doneQty}/${l.planQty}（OEE 目标 ${Math.round(l.oeeTarget*100)}%）</div>
        <div class="bar"><i class="${l.planQty>0&&l.doneQty/l.planQty<0.5?'warn':''}" style="width:${l.planQty>0?Math.min(100,l.doneQty*100/l.planQty):0}%"></i></div>
      </div>`).join('');
    const os = await j(fetch('/api/orders'));
    document.getElementById('orders').innerHTML = os.map(o => `
      <div class="ln">
        <div class="top"><b>${o.id} · ${o.product}</b>${woTag(o.status)}</div>
        <div class="meta">${o.lineId} · ${o.done}/${o.qty} 件 · 交期 ${o.due} · 下单 ${o.createdAt}</div>
        <div class="bar"><i style="width:${Math.min(100,o.done*100/o.qty)}%"></i></div>
      </div>`).join('');
  } catch(e) { console.error(e); }
}
function ask(t) { document.getElementById('q').value = t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
